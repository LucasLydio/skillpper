name: Update skills index

on:
  push:
    paths:
      - '*/SKILL.md'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-skills-index.yml'
  pull_request:
    paths:
      - '*/SKILL.md'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-skills-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests
      # PR contributors need not commit generated rows; malformed metadata still fails.
      - run: python scripts/update_skills_index.py
      - run: python scripts/update_skills_index.py --check

  update:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: skills-index-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from the latest branch state, even if this run was queued.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/update_skills_index.py
      - name: Commit the updated index
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Skills index is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: update skills index"
          git push origin "HEAD:$DEFAULT_BRANCH"
