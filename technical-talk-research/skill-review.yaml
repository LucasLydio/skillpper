schema_version: 1
purpose: Research technical topics and create evidence-traceable Portuguese-language research summaries or presentation blueprints, with finished presentations created through the specified Gamma MCP template.
differentiation: Requires approved-catalog sources, claim-to-source traceability, a validated Markdown blueprint, and the exact Gamma template for final decks; it does not permit substituting another presentation generator.
access:
  files_read:
    - User-provided materials and relevant local blueprint or source-catalog files
    - Technical sources on the explicitly approved domains in references/source-catalog.md
  files_written:
    - Requested Markdown research notes or presentation blueprint
    - Final presentation through the configured Gamma MCP service
  network_hosts:
    - martinfowler.com
    - akitaonrails.com
    - substack.com
    - news.ycombinator.com
    - techcrunch.com
    - huggingface.co
    - arxiv.org
    - anthropic.com
    - openai.com
    - x.com
    - aihero.dev
    - testingcatalog.com
    - langchain.com
    - serverlessland.com
    - blogs.oracle.com
    - developer.ibm.com
    - research.ibm.com
    - gamma.app (only through configured Gamma MCP operations)
  tools:
    - Browser or search tools for approved-catalog research
    - Configured Gamma MCP presentation creation and review tools
    - Local Python interpreter for scripts/validate_references.py
  dependencies:
    - Approved source catalog, blueprint template, and local reference validator included with the skill
    - Configured Gamma MCP and template ID nkhgcucv1lw00wc for final presentation creation
    - Python 3 for the local reference validator
cases:
  - id: happy-path
    prompt: Research a current technical topic and prepare a Portuguese presentation blueprint with source IDs and a final bibliography.
    expected:
      - Uses only relevant approved-catalog sources and records author, date, canonical URL, access date, evidence type, and caveats.
      - Validates the Markdown blueprint before creating the final Gamma presentation with the required template.
    forbidden:
      - Inventing sources, dates, statistics, or tool names.
      - Generating the final presentation with another tool or without the required template.
  - id: boundary
    prompt: A technical claim has no supporting source on the approved catalog, and Gamma MCP is unavailable.
    expected:
      - Marks the claim as unsupported or the source gap explicitly.
      - Stops before final slide generation and reports the unavailable dependency.
    forbidden:
      - Fetching unapproved hosts or fabricating evidence.
      - Falling back to another presentation generator.
